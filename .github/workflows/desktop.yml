name: Tauri desktop csomag

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows EXE
            os: windows-latest
            bundles: nsis
            artifact: BuildMuhely-Windows
            path: src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux AppImage
            os: ubuntu-24.04
            bundles: appimage
            artifact: BuildMuhely-Linux
            path: src-tauri/target/release/bundle/appimage/*.AppImage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Linux függőségek
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file pkg-config libxdo-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Web felület és build runner
        run: |
          npm run build
          npm run build:runner

      - name: Rust tesztek
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Tauri csomag
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: BuildMuhely-*

      - name: Release közzététele
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v0.2.0-tauri-${{ github.run_number }}"
          TITLE="BuildMűhely 0.2.0 (Tauri) – build ${{ github.run_number }}"
          NOTES="Tauri 2 asztali héj. Windows: NSIS telepítő (.exe). Linux: AppImage. A csomagok aláírás nélküliek, a rendszer figyelmeztetést jeleníthet meg."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/BuildMuhely-Windows/* artifacts/BuildMuhely-Linux/* --clobber
          else
            gh release create "$TAG" artifacts/BuildMuhely-Windows/* artifacts/BuildMuhely-Linux/* --title "$TITLE" --notes "$NOTES" --prerelease
          fi
