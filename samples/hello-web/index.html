<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello BuildMűhely</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
    }
    .card {
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px; padding: 40px; max-width: 520px; text-align: center;
      backdrop-filter: blur(8px);
    }
    h1 { margin: 0 0 12px; font-size: 2rem; }
    p { line-height: 1.6; color: #cbd5e1; }
    button {
      margin-top: 16px; padding: 12px 24px; border: 0; border-radius: 12px;
      background: #38bdf8; color: #0f172a; font-weight: 700; cursor: pointer;
    }
    #count { font-variant-numeric: tabular-nums; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Szia, BuildMűhely! 👋</h1>
    <p>Ez a mintaprojekt azt mutatja meg, hogy a webes forrásodból valódi alkalmazás készülhet.</p>
    <p>Kattintások: <span id="count">0</span></p>
    <button id="btn">Kattints ide</button>
  </div>
  <script>
    let n = 0;
    const count = document.getElementById('count');
    document.getElementById('btn').addEventListener('click', () => {
      n += 1;
      count.textContent = String(n);
    });
  </script>
</body>
</html>
